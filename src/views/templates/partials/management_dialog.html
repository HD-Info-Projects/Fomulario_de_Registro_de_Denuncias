<dialog id="management-confirm" class="management-confirm-dialog" aria-labelledby="management-confirm-title" aria-describedby="management-confirm-target management-confirm-message">
    <form method="dialog" class="management-confirm-content">
        <span class="management-confirm-icon" aria-hidden="true"><i class="fa-solid fa-shield-halved"></i></span>
        <h2 id="management-confirm-title" data-confirm-title>Confirmar alteração</h2>
        <p id="management-confirm-target" class="management-confirm-target" data-confirm-target hidden></p>
        <p id="management-confirm-message" data-confirm-message>Confirme a alteração antes de continuar.</p>
        <div class="management-confirm-actions">
            <button class="management-button secondary" value="cancel" autofocus>Cancelar</button>
            <button class="management-button primary" value="confirm" data-confirm-submit>Confirmar</button>
        </div>
    </form>
</dialog>
