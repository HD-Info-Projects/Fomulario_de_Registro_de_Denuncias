services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dados_denuncias}
      MYSQL_USER: ${MYSQL_USER:-denuncias_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      DATABASE_URI: mysql+pymysql://${MYSQL_USER:-denuncias_user}:${MYSQL_PASSWORD:?set MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-dados_denuncias}
      UPLOAD_FOLDER: /app/instance/uploads/denuncias
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-redis://redis:6379/0}
      RUN_MIGRATIONS: 0
    command: ["alembic", "upgrade", "head"]

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-5000}:5000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      DATABASE_URI: mysql+pymysql://${MYSQL_USER:-denuncias_user}:${MYSQL_PASSWORD:?set MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-dados_denuncias}
      UPLOAD_FOLDER: /app/instance/uploads/denuncias
      ALLOWED_EXTENSIONS: ${ALLOWED_EXTENSIONS:-png,jpg,jpeg,webp,mp4,mov,avi,mkv}
      MAX_CONTENT_LENGTH: ${MAX_CONTENT_LENGTH:-104857600}
      MAX_UPLOAD_FILE_SIZE: ${MAX_UPLOAD_FILE_SIZE:-26214400}
      MAX_FILES_PER_DENUNCIA: ${MAX_FILES_PER_DENUNCIA:-5}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-1}
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-redis://redis:6379/0}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-0}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - uploads:/app/instance/uploads/denuncias
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  mysql_data:
  uploads:
